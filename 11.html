<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мотивация дня</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('22.jpg');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
            .motivation-card {
            background-color: rgba(151, 150, 165, 0.3);
            background-size: cover;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 500vh;
            text-align: center;
            margin: 20px;
        }
        
        .motivation-quote {
            font-size: 1.5rem;
            color: rgba(254, 167, 177);
            font-weight: 600;
            line-height: 1.4;
            margin: 0 0 20px 0;
        }
        
        .motivation-author {
            font-size: 1rem;
            color: rgba(254, 167, 177);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="motivation-card">
        <blockquote class="motivation-quote">
            «Не стесняйтесь своих чувств и желаний. Другой жизни для них не будет.»
        </blockquote>
        <div class="motivation-author">© Листопадова Виктория Игорьевна</div>
    </div>

</body>
</html>
