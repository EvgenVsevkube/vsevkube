<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя первая страница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #4a6fa5;
            color: white;
            text-align: center;
            padding: 2rem 1rem;
        }
        main {
            flex: 1;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 1rem;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Добро пожаловать на сайт!</h1>
        <p>Это пример простой HTML-страницы со стилями</p>
    </header>

    <main>
        <div class="card">
            <h2>О проекте</h2>
            <p>Здесь вы можете разместить любую информацию о себе, своей компании или вашем хобби.</p>
        </div>
        <div class="card">
            <h2>Контакты</h2>
            <p>Напишите нам на почту: example@domain.com</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Моя страница. Все права защищены.</p>
    </footer>

</body>
</html>
